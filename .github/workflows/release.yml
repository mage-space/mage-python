name: Release

# release-please keeps a release PR open from the conventional commits on main. Merging it
# tags the release, and this workflow then publishes to PyPI with trusted publishing.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    # Idle until the release bot is configured (see CONTRIBUTING.md).
    if: vars.MAGE_BOT_APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token, so CI runs on the release PR.
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.MAGE_BOT_APP_ID }}
          private-key: ${{ secrets.MAGE_BOT_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to PyPI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mage-space/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
